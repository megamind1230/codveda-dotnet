<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterPick — Discussion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">CounterPick</a>
    <div class="collapse navbar-collapse show" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Heroes</a></li>
        <li class="nav-item d-none" id="nav-admin"><a class="nav-link" href="/admin.html">Admin</a></li>
        <li class="nav-item" id="nav-login"><a class="nav-link" href="/login.html">Login</a></li>
        <li class="nav-item d-none" id="nav-logout"><a class="nav-link" href="#" id="btn-logout">Logout</a></li>
        <li class="nav-item d-none" id="nav-user"><span class="nav-link text-muted" id="user-badge"></span></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    <a href="#" class="btn btn-dota-outline btn-sm mb-3" id="backLink">&larr; Back</a>
    <div id="suggestionInfo" class="mb-4"></div>

    <h4>Comments</h4>
    <div id="commentsList"></div>

    <div id="addCommentSection" class="mt-4 d-none">
      <div class="row g-2">
        <div class="col-md-10">
          <input type="text" class="form-control" id="commentInput" placeholder="Add your comment..."
            style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);">
        </div>
        <div class="col-md-2">
          <button class="btn btn-dota w-100" id="btnAddComment">Post</button>
        </div>
      </div>
    </div>
    <p class="text-muted mt-2 d-none" id="loginToComment">
      <a href="/login.html">Login</a> to join the discussion.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const suggestionId = new URLSearchParams(location.search).get('suggestionId');

    document.addEventListener('DOMContentLoaded', async () => {
      if (!suggestionId) {
        document.getElementById('commentsList').innerHTML = '<div class="text-danger">No suggestion specified.</div>';
        return;
      }

      document.getElementById('backLink').href = document.referrer || '/';

      if (isAuthenticated()) {
        document.getElementById('addCommentSection').classList.remove('d-none');
      } else {
        document.getElementById('loginToComment').classList.remove('d-none');
      }

      loadComments();

      document.getElementById('btnAddComment').addEventListener('click', async () => {
        const content = document.getElementById('commentInput').value.trim();
        if (!content) { showToast('Comment cannot be empty.', true); return; }
        const resp = await apiFetch(`/api/counters/${suggestionId}/comments`, {
          method: 'POST',
          body: JSON.stringify({ content })
        });
        if (resp && resp.ok) {
          document.getElementById('commentInput').value = '';
          showToast('Comment posted!');
          loadComments();
        } else if (resp) {
          showToast('Failed to post comment.', true);
        }
      });
    });

    async function loadComments() {
      const container = document.getElementById('commentsList');
      container.innerHTML = '<div class="text-muted py-3">Loading comments...</div>';

      const resp = await fetch(`/api/counters/${suggestionId}/comments`);
      if (!resp.ok) { container.innerHTML = '<div class="text-muted py-3">Failed to load comments.</div>'; return; }
      const comments = await resp.json();

      const currentUserId = getCurrentUserId();

      if (comments.length === 0) {
        container.innerHTML = '<div class="text-muted py-3">No comments yet. Be the first!</div>';
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="comment-item" id="comment-${c.id}">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <strong class="small">${c.userName}</strong>
              <span class="text-muted small ms-2">${new Date(c.createdAt).toLocaleDateString()}</span>
            </div>
            ${c.userId === currentUserId ? `
              <div class="d-flex gap-1">
                <button class="btn btn-sm btn-dota-outline" onclick="editComment(${c.id})">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteComment(${c.id})">Delete</button>
              </div>
            ` : ''}
          </div>
          <p class="mb-1 mt-1" id="commentContent-${c.id}">${c.content}</p>
          <div class="d-flex align-items-center gap-2">
            <button class="like-btn" data-comment-id="${c.id}" onclick="toggleLike(${c.id})">
              &#9829; <span id="likeCount-${c.id}">${c.likeCount}</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function editComment(commentId) {
      const contentEl = document.getElementById(`commentContent-${commentId}`);
      const currentText = contentEl.textContent;
      contentEl.dataset.originalText = currentText;
      contentEl.innerHTML = `
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="editInput-${commentId}" value="${currentText.replace(/"/g, '&quot;')}"
            style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);">
          <button class="btn btn-sm btn-dota" onclick="saveEdit(${commentId})">Save</button>
          <button class="btn btn-sm btn-dota-outline" onclick="cancelEdit(${commentId})">Cancel</button>
        </div>`;
    }

    async function saveEdit(commentId) {
      const input = document.getElementById(`editInput-${commentId}`);
      const content = input.value.trim();
      if (!content) { showToast('Comment cannot be empty.', true); return; }
      const resp = await apiFetch(`/api/comments/${commentId}`, {
        method: 'PUT',
        body: JSON.stringify({ content })
      });
      if (resp && resp.ok) {
        showToast('Comment updated!');
        loadComments();
      } else {
        showToast('Failed to update comment.', true);
      }
    }

    function cancelEdit(commentId) {
      const contentEl = document.getElementById(`commentContent-${commentId}`);
      contentEl.textContent = contentEl.dataset.originalText || '';
    }

    async function deleteComment(commentId) {
      if (!confirm('Delete this comment? This cannot be undone.')) return;
      const resp = await apiFetch(`/api/comments/${commentId}`, { method: 'DELETE' });
      if (resp && resp.ok) {
        showToast('Comment deleted.');
        loadComments();
      } else {
        showToast('Failed to delete comment.', true);
      }
    }

    async function toggleLike(commentId) {
      if (!isAuthenticated()) { showToast('Login to like comments.', true); return; }
      const resp = await apiFetch(`/api/comments/${commentId}/like`, { method: 'POST' });
      if (resp && resp.ok) {
        const data = await resp.json();
        document.getElementById(`likeCount-${commentId}`).textContent = data.likeCount;
      }
    }
  </script>
</body>
</html>
