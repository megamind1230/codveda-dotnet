<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterPick — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">CounterPick</a>
    <div class="collapse navbar-collapse show" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Heroes</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin.html">Admin</a></li>
        <li class="nav-item" id="nav-login"><a class="nav-link" href="/login.html">Login</a></li>
        <li class="nav-item d-none" id="nav-logout"><a class="nav-link" href="#" id="btn-logout">Logout</a></li>
        <li class="nav-item d-none" id="nav-user"><span class="nav-link text-muted" id="user-badge"></span></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-4">Admin Panel</h1>
    <p class="text-muted">Manage registered users. Admin role required.</p>

    <div class="table-responsive">
      <table class="table admin-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Lockout</th>
            <th>Failed Logins</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!isAuthenticated()) {
        window.location.href = '/login.html';
        return;
      }
      if (!isAdmin()) {
        document.querySelector('main').innerHTML = '<h1 class="text-center py-5">Access denied. Admin only.</h1>';
        return;
      }
      loadUsers();
    });

    async function loadUsers() {
      const resp = await apiFetch('/api/admin/users');
      if (!resp) return;
      const users = await resp.json();
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.userName || '(no name)'}</td>
          <td>${u.email || '—'}</td>
          <td>${u.lockoutEnabled ? '<span class="text-warning">Enabled</span>' : '<span class="text-muted">Off</span>'}</td>
          <td>${u.accessFailedCount}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}', '${u.userName || ''}')" ${u.userName === 'admin' ? 'disabled title="Cannot delete admin"' : ''}>Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteUser(id, name) {
      if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
      const currentId = getCurrentUserId();
      if (id === currentId) { showToast('Cannot delete yourself.', true); return; }
      const resp = await apiFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      if (resp && resp.ok) {
        showToast(`User "${name}" deleted.`);
        loadUsers();
      } else if (resp) {
        const err = await resp.json().catch(() => ({}));
        showToast(err.message || err.title || 'Delete failed.', true);
      }
    }
  </script>
</body>
</html>
