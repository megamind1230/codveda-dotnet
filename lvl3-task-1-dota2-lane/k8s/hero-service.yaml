apiVersion: apps/v1
kind: Deployment
metadata:
  name: hero-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hero-service
  template:
    metadata:
      labels:
        app: hero-service
    spec:
      containers:
        - name: hero-service
          image: dotalane/hero-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: dotalane-config
          env:
            - name: ADVERTISE_HOST
              value: "hero-service"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Kubernetes"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hero-service
spec:
  selector:
    app: hero-service
  ports:
    - port: 5001
      targetPort: 5001
