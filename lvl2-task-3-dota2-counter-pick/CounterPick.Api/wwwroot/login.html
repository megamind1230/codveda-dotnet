<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterPick — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">CounterPick</a>
    <div class="collapse navbar-collapse show" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Heroes</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="auth-section">
      <h2 class="text-center mb-4">Welcome</h2>

      <ul class="nav nav-tabs justify-content-center mb-4" id="authTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="loginTab">
          <div class="card p-4">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="loginUsername" placeholder="admin">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-dota w-100" id="btnLogin">Sign In</button>
            <div class="divider mt-3 mb-3">or</div>
            <a href="/auth/external-login/Google" class="btn btn-outline-light w-100 mb-2">
              <img src="https://www.google.com/favicon.ico" alt="" style="width:18px;height:18px;margin-right:8px;"> Sign in with Google
            </a>
            <a href="/auth/external-login/Microsoft" class="btn btn-outline-light w-100">
              <img src="https://www.microsoft.com/favicon.ico" alt="" style="width:18px;height:18px;margin-right:8px;"> Sign in with Microsoft
            </a>
          </div>
        </div>

        <div class="tab-pane fade" id="registerTab">
          <div class="card p-4">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="regUsername" placeholder="Choose a username">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="regEmail" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters">
            </div>
            <button class="btn btn-dota w-100" id="btnRegister">Create Account</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (isAuthenticated()) {
        const params = new URLSearchParams(location.hash.replace('#', '?'));
        if (params.get('access_token')) {
          setTokens(params.get('access_token'), params.get('refresh_token'));
        }
        window.location.href = '/';
        return;
      }

      const hash = location.hash;
      if (hash.startsWith('#access_token=')) {
        const params = new URLSearchParams(hash.replace('#', '?'));
        setTokens(params.get('access_token'), params.get('refresh_token'));
        window.location.href = '/';
        return;
      }

      const errParams = new URLSearchParams(location.hash.replace('#', '?'));
      if (errParams.get('error')) {
        showToast('OAuth error: ' + errParams.get('error'), true);
      }

      document.getElementById('btnLogin').addEventListener('click', async () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) { showToast('Fill in all fields.', true); return; }
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!resp.ok) { showToast('Invalid credentials.', true); return; }
        const data = await resp.json();
        setTokens(data.accessToken, data.refreshToken);
        showToast('Login successful!');
        setTimeout(() => window.location.href = '/', 500);
      });

      document.getElementById('btnRegister').addEventListener('click', async () => {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!username || !email || !password) { showToast('Fill in all fields.', true); return; }
        const resp = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        if (!resp.ok) {
          const err = await resp.json();
          const msg = Array.isArray(err) ? err.map(e => e.description).join(', ') : 'Registration failed.';
          showToast(msg, true);
          return;
        }
        const data = await resp.json();
        setTokens(data.accessToken, data.refreshToken);
        showToast('Account created!');
        setTimeout(() => window.location.href = '/', 500);
      });
    });
  </script>
</body>
</html>
