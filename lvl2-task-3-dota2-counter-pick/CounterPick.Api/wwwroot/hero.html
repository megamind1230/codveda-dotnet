<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterPick — Hero Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">CounterPick</a>
    <div class="collapse navbar-collapse show" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Heroes</a></li>
        <li class="nav-item" id="nav-login"><a class="nav-link" href="/login.html">Login</a></li>
        <li class="nav-item d-none" id="nav-logout"><a class="nav-link" href="#" id="btn-logout">Logout</a></li>
        <li class="nav-item d-none" id="nav-user"><span class="nav-link text-muted" id="user-badge"></span></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    <a href="/" class="btn btn-dota-outline btn-sm mb-3">&larr; Back to Heroes</a>
    <div id="heroDetail"></div>
    <h3 class="mt-4">Counter Suggestions</h3>
    <div id="countersList"></div>
    <div id="addCounterSection" class="mt-3 d-none">
      <h5>Suggest a Counter</h5>
      <div class="row g-2">
        <div class="col-md-6">
          <select class="form-control" id="counterHeroSelect" style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);"></select>
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="counterReason" placeholder="Why?" style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);">
        </div>
        <div class="col-md-2">
          <button class="btn btn-dota w-100" id="btnAddCounter">Submit</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const heroId = new URLSearchParams(location.search).get('id');

    function attrClass(pa) {
      if (pa === 'str') return 'attr-str';
      if (pa === 'agi') return 'attr-agi';
      if (pa === 'int') return 'attr-int';
      return 'attr-all';
    }

    function attrLabel(pa) {
      const map = { str: 'Strength', agi: 'Agility', int: 'Intelligence' };
      return map[pa] || 'Universal';
    }

    function canEditSuggestion(suggestedById) {
      return getCurrentUserId() === suggestedById || isAdmin();
    }

    let currentHero = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!heroId) { document.getElementById('heroDetail').innerHTML = '<div class="text-danger">No hero ID specified.</div>'; return; }

      const heroResp = await apiFetch(`/api/heroes/${heroId}`);
      if (!heroResp) { document.getElementById('heroDetail').innerHTML = '<div class="text-danger py-5">Failed to load hero.</div>'; return; }
      currentHero = await heroResp.json();

      renderHeroDetail();

      loadCounters();
      if (isAuthenticated()) {
        document.getElementById('addCounterSection').classList.remove('d-none');
        loadOtherHeroes();
      }
    });

    function renderHeroDetail() {
      const hero = currentHero;
      const admin = isAdmin();
      document.getElementById('heroDetail').innerHTML = `
        <div class="row">
          <div class="col-md-3">
            <img src="${hero.imageUrl}" alt="${hero.localizedName}" class="hero-detail-img">
          </div>
          <div class="col-md-9">
            <div class="d-flex align-items-start justify-content-between">
              <h2 class="view-mode"><span class="attr-badge ${attrClass(hero.primaryAttr)}"></span> ${hero.localizedName}</h2>
              ${admin ? '<div class="view-mode d-flex gap-1"><button class="btn btn-dota-outline btn-sm btn-edit-hero">Edit</button><button class="btn btn-outline-danger btn-sm btn-delete-hero">Delete</button></div>' : ''}
            </div>
            <div class="view-mode mb-2">
              <span class="badge bg-secondary me-1">${attrLabel(hero.primaryAttr)}</span>
              <span class="badge bg-secondary me-1">${hero.attackType}</span>
              ${(hero.roles || '').split(',').map(r => `<span class="badge bg-dark me-1">${r.trim()}</span>`).join('')}
            </div>
            <p class="text-muted small view-mode">${hero.localizedName} is a ${hero.attackType.toLowerCase()} ${attrLabel(hero.primaryAttr).toLowerCase()} hero.</p>
            <div class="edit-mode-hero d-none">
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label small">Localized Name</label>
                  <input type="text" class="form-control form-control-sm edit-hero-name" value="${hero.localizedName}" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                </div>
                <div class="col-6">
                  <label class="form-label small">Name</label>
                  <input type="text" class="form-control form-control-sm edit-hero-slug" value="${hero.name}" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                </div>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-4">
                  <label class="form-label small">Primary Attr</label>
                  <select class="form-control form-control-sm edit-hero-attr" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                    <option value="str" ${hero.primaryAttr === 'str' ? 'selected' : ''}>Strength</option>
                    <option value="agi" ${hero.primaryAttr === 'agi' ? 'selected' : ''}>Agility</option>
                    <option value="int" ${hero.primaryAttr === 'int' ? 'selected' : ''}>Intelligence</option>
                    <option value="all" ${hero.primaryAttr === 'all' ? 'selected' : ''}>Universal</option>
                  </select>
                </div>
                <div class="col-4">
                  <label class="form-label small">Attack Type</label>
                  <select class="form-control form-control-sm edit-hero-attack" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                    <option value="Melee" ${hero.attackType === 'Melee' ? 'selected' : ''}>Melee</option>
                    <option value="Ranged" ${hero.attackType === 'Ranged' ? 'selected' : ''}>Ranged</option>
                  </select>
                </div>
                <div class="col-4">
                  <label class="form-label small">Image URL</label>
                  <input type="text" class="form-control form-control-sm edit-hero-image" value="${hero.imageUrl}" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label small">Roles (comma-separated)</label>
                <input type="text" class="form-control form-control-sm edit-hero-roles" value="${hero.roles}" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
              </div>
              <div class="d-flex gap-1">
                <button class="btn btn-dota btn-sm btn-save-hero">Save</button>
                <button class="btn btn-dota-outline btn-sm btn-cancel-hero">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.querySelector('.btn-edit-hero')?.addEventListener('click', () => {
        document.querySelectorAll('.view-mode').forEach(el => el.classList.add('d-none'));
        document.querySelector('.edit-mode-hero').classList.remove('d-none');
      });

      document.querySelector('.btn-cancel-hero')?.addEventListener('click', () => {
        renderHeroDetail();
      });

      document.querySelector('.btn-save-hero')?.addEventListener('click', async () => {
        const body = {
          name: document.querySelector('.edit-hero-slug').value.trim(),
          localizedName: document.querySelector('.edit-hero-name').value.trim(),
          primaryAttr: document.querySelector('.edit-hero-attr').value,
          attackType: document.querySelector('.edit-hero-attack').value,
          roles: document.querySelector('.edit-hero-roles').value.trim(),
          imageUrl: document.querySelector('.edit-hero-image').value.trim()
        };
        const resp = await apiFetch(`/api/heroes/${hero.id}`, {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        if (resp && resp.ok) {
          showToast('Hero updated!');
          currentHero = await resp.json();
          renderHeroDetail();
        } else if (resp) {
          const err = await resp.json().catch(() => ({}));
          showToast(err.message || 'Failed to update hero.', true);
        }
      });

      document.querySelector('.btn-delete-hero')?.addEventListener('click', async () => {
        if (!confirm('Delete this hero and all its counter suggestions?')) return;
        const resp = await apiFetch(`/api/heroes/${hero.id}`, { method: 'DELETE' });
        if (resp && resp.ok) {
          showToast('Hero deleted!');
          setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
          showToast('Failed to delete hero.', true);
        }
      });
    }

    async function loadCounters() {
      const resp = await apiFetch(`/api/heroes/${heroId}/counters`);
      if (!resp) { document.getElementById('countersList').innerHTML = '<div class="text-muted">Failed to load counters.</div>'; return; }
      const counters = await resp.json();
      const container = document.getElementById('countersList');
      if (counters.length === 0) {
        container.innerHTML = '<div class="text-muted py-3">No counter suggestions yet.</div>';
        return;
      }
      container.innerHTML = counters.map(c => {
        const canEdit = canEditSuggestion(c.suggestedById);
        return `
          <div class="counter-item" data-id="${c.id}">
            <div class="d-flex align-items-center gap-3">
              <img src="${c.counterHero.imageUrl}" alt="${c.counterHero.localizedName}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;">
              <div class="flex-grow-1">
                <strong><a href="/hero.html?id=${c.counterHero.id}" class="text-decoration-none" style="color:var(--text-primary)">${c.counterHero.localizedName}</a></strong>
                <div class="counter-reason view-mode">${c.reason}</div>
                <div class="counter-suggested-by view-mode">— suggested by ${c.suggestedByUserName}</div>
                <div class="edit-mode d-none">
                  <div class="row g-2 mt-1">
                    <div class="col-md-6">
                      <select class="form-control form-control-sm edit-hero-select" style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);"></select>
                    </div>
                    <div class="col-md-4">
                      <input type="text" class="form-control form-control-sm edit-reason" value="${c.reason}" style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);">
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                      <button class="btn btn-dota btn-sm btn-save-edit">Save</button>
                      <button class="btn btn-dota-outline btn-sm btn-cancel-edit">Cancel</button>
                    </div>
                  </div>
                </div>
              </div>
              ${canEdit ? `
                <div class="view-mode d-flex gap-1">
                  <button class="btn btn-dota-outline btn-sm btn-edit-suggestion">Edit</button>
                  <button class="btn btn-outline-danger btn-sm btn-delete-suggestion">Delete</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.btn-edit-suggestion').forEach(btn => {
        btn.addEventListener('click', e => {
          const item = e.target.closest('.counter-item');
          item.querySelector('.view-mode').classList.add('d-none');
          item.querySelector('.edit-mode').classList.remove('d-none');
          loadEditHeroes(item);
        });
      });

      document.querySelectorAll('.btn-cancel-edit').forEach(btn => {
        btn.addEventListener('click', e => {
          const item = e.target.closest('.counter-item');
          item.querySelector('.view-mode').classList.remove('d-none');
          item.querySelector('.edit-mode').classList.add('d-none');
        });
      });

      document.querySelectorAll('.btn-save-edit').forEach(btn => {
        btn.addEventListener('click', async e => {
          const item = e.target.closest('.counter-item');
          const suggestionId = item.dataset.id;
          const counterHeroId = item.querySelector('.edit-hero-select').value;
          const reason = item.querySelector('.edit-reason').value.trim();
          if (!counterHeroId || !reason) { showToast('Select a hero and provide a reason.', true); return; }
          const resp = await apiFetch(`/api/heroes/${heroId}/counters/${suggestionId}`, {
            method: 'PUT',
            body: JSON.stringify({ counterHeroId: parseInt(counterHeroId), reason })
          });
          if (resp && resp.ok) {
            showToast('Suggestion updated!');
            loadCounters();
          } else if (resp) {
            const err = await resp.json().catch(() => ({}));
            showToast(err.message || 'Failed to update.', true);
          }
        });
      });

      document.querySelectorAll('.btn-delete-suggestion').forEach(btn => {
        btn.addEventListener('click', async e => {
          if (!confirm('Delete this suggestion?')) return;
          const item = e.target.closest('.counter-item');
          const suggestionId = item.dataset.id;
          const resp = await apiFetch(`/api/heroes/${heroId}/counters/${suggestionId}`, {
            method: 'DELETE'
          });
          if (resp && resp.ok) {
            showToast('Suggestion deleted!');
            loadCounters();
          } else {
            showToast('Failed to delete.', true);
          }
        });
      });
    }

    async function loadEditHeroes(item) {
      if (item.querySelector('.edit-hero-select').options.length > 0) return;
      const resp = await apiFetch('/api/heroes');
      if (!resp) return;
      const heroes = await resp.json();
      const sel = item.querySelector('.edit-hero-select');
      sel.innerHTML = heroes.filter(h => h.id != heroId).map(h =>
        `<option value="${h.id}">${h.localizedName}</option>`
      ).join('');
    }

    async function loadOtherHeroes() {
      const resp = await apiFetch('/api/heroes');
      if (!resp) return;
      const heroes = await resp.json();
      const sel = document.getElementById('counterHeroSelect');
      sel.innerHTML = heroes.filter(h => h.id != heroId).map(h =>
        `<option value="${h.id}">${h.localizedName}</option>`
      ).join('');
    }

    document.getElementById('btnAddCounter').addEventListener('click', async () => {
      const counterHeroId = document.getElementById('counterHeroSelect').value;
      const reason = document.getElementById('counterReason').value.trim();
      if (!counterHeroId || !reason) { showToast('Select a hero and provide a reason.', true); return; }
      const resp = await apiFetch(`/api/heroes/${heroId}/counters`, {
        method: 'POST',
        body: JSON.stringify({ counterHeroId: parseInt(counterHeroId), reason })
      });
      if (resp && resp.ok) {
        showToast('Counter suggestion added!');
        document.getElementById('counterReason').value = '';
        loadCounters();
      } else if (resp) {
        const err = await resp.json().catch(() => ({}));
        showToast(err.message || err.title || 'Failed to add counter.', true);
      }
    });
  </script>
</body>
</html>
