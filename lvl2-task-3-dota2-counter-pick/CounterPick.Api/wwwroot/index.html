<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterPick — Dota 2 Hero Counters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="/">CounterPick</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Heroes</a></li>
        <li class="nav-item" id="nav-login"><a class="nav-link" href="/login.html">Login</a></li>
        <li class="nav-item d-none" id="nav-logout"><a class="nav-link" href="#" id="btn-logout">Logout</a></li>
        <li class="nav-item d-none" id="nav-user"><span class="nav-link text-muted" id="user-badge"></span></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-4">Hero Browser</h1>

    <div class="row mb-3 g-2 align-items-center">
      <div class="col-md-5">
        <input type="text" class="form-control search-input" id="searchInput" placeholder="Search heroes...">
      </div>
      <div class="col-md-7">
        <div class="d-flex gap-2 flex-wrap">
          <button class="attr-filter-btn active" data-attr="all">All</button>
          <button class="attr-filter-btn" data-attr="str"><span class="attr-badge attr-str"></span>Strength</button>
          <button class="attr-filter-btn" data-attr="agi"><span class="attr-badge attr-agi"></span>Agility</button>
          <button class="attr-filter-btn" data-attr="int"><span class="attr-badge attr-int"></span>Intelligence</button>
          <button class="attr-filter-btn" data-attr="uni"><span class="attr-badge attr-all"></span>Universal</button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <div class="text-muted small" id="heroCount"></div>
      <button class="btn btn-dota btn-sm d-none" id="btnAddHero" data-bs-toggle="modal" data-bs-target="#addHeroModal">+ Add Hero</button>
    </div>
    <div class="row g-3" id="heroGrid"></div>
  </main>

  <div class="modal fade" id="addHeroModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="background:var(--card-bg);color:var(--text-primary);border-color:var(--card-border);">
        <div class="modal-header">
          <h5 class="modal-title">Add Hero</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label small">ID</label>
            <input type="number" class="form-control" id="heroIdInput" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
          </div>
          <div class="mb-2">
            <label class="form-label small">Name</label>
            <input type="text" class="form-control" id="heroNameInput" placeholder="npc_dota_hero_antimage" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
          </div>
          <div class="mb-2">
            <label class="form-label small">Localized Name</label>
            <input type="text" class="form-control" id="heroLocalizedNameInput" placeholder="Anti-Mage" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small">Primary Attr</label>
              <select class="form-control" id="heroAttrInput" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                <option value="str">Strength</option>
                <option value="agi">Agility</option>
                <option value="int">Intelligence</option>
                <option value="all">Universal</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small">Attack Type</label>
              <select class="form-control" id="heroAttackInput" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
                <option value="Melee">Melee</option>
                <option value="Ranged">Ranged</option>
              </select>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small">Roles (comma-separated)</label>
            <input type="text" class="form-control" id="heroRolesInput" placeholder="Carry, Escape, Nuker" style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
          </div>
          <div class="mb-2">
            <label class="form-label small">Image URL</label>
            <input type="text" class="form-control" id="heroImageInput" placeholder="https://cdn.steamstatic.com/..." style="background:var(--bg);color:var(--text-primary);border-color:var(--card-border);">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dota-outline" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-dota" id="btnSaveHero">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let allHeroes = [];

    function attrClass(pa) {
      if (pa === 'str') return 'attr-str';
      if (pa === 'agi') return 'attr-agi';
      if (pa === 'int') return 'attr-int';
      return 'attr-all';
    }

    function attrLabel(pa) {
      const map = { str: 'Strength', agi: 'Agility', int: 'Intelligence' };
      return map[pa] || 'Universal';
    }

    function renderHeroes(heroes) {
      const grid = document.getElementById('heroGrid');
      const count = document.getElementById('heroCount');
      count.textContent = `${heroes.length} heroes`;
      grid.innerHTML = heroes.map(h => `
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <div class="hero-card" onclick="location.href='/hero.html?id=${h.id}'">
            <img src="${h.imageUrl}" alt="${h.localizedName}" loading="lazy">
            <div class="hero-name">
              <span class="attr-badge ${attrClass(h.primaryAttr)}"></span>
              ${h.localizedName}
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterHeroes() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const attr = document.querySelector('.attr-filter-btn.active')?.dataset.attr || 'all';
      let filtered = allHeroes;
      if (attr === 'uni') filtered = filtered.filter(h => h.primaryAttr === 'all');
      else if (attr !== 'all') filtered = filtered.filter(h => h.primaryAttr === attr);
      if (q) filtered = filtered.filter(h => h.localizedName.toLowerCase().includes(q));
      renderHeroes(filtered);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('heroGrid');
      grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Loading heroes...</div>';

      const resp = await apiFetch('/api/heroes');
      if (!resp) { grid.innerHTML = '<div class="col-12 text-center text-danger py-5">Failed to load heroes.</div>'; return; }
      allHeroes = await resp.json();
      renderHeroes(allHeroes);

      document.getElementById('searchInput').addEventListener('input', filterHeroes);
      document.querySelectorAll('.attr-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.attr-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterHeroes();
        });
      });

      if (isAdmin()) {
        document.getElementById('btnAddHero').classList.remove('d-none');
      }
    });

    document.getElementById('btnSaveHero').addEventListener('click', async () => {
      const body = {
        id: parseInt(document.getElementById('heroIdInput').value),
        name: document.getElementById('heroNameInput').value.trim(),
        localizedName: document.getElementById('heroLocalizedNameInput').value.trim(),
        primaryAttr: document.getElementById('heroAttrInput').value,
        attackType: document.getElementById('heroAttackInput').value,
        roles: document.getElementById('heroRolesInput').value.trim(),
        imageUrl: document.getElementById('heroImageInput').value.trim()
      };

      if (!body.id || !body.name || !body.localizedName) {
        showToast('ID, Name, and Localized Name are required.', true);
        return;
      }

      const resp = await apiFetch('/api/heroes', {
        method: 'POST',
        body: JSON.stringify(body)
      });

      if (resp && resp.ok) {
        showToast('Hero created!');
        const modal = bootstrap.Modal.getInstance(document.getElementById('addHeroModal'));
        modal.hide();
        document.getElementById('heroIdInput').value = '';
        document.getElementById('heroNameInput').value = '';
        document.getElementById('heroLocalizedNameInput').value = '';
        document.getElementById('heroRolesInput').value = '';
        document.getElementById('heroImageInput').value = '';
        const newHero = await resp.json();
        allHeroes.push(newHero);
        allHeroes.sort((a, b) => a.localizedName.localeCompare(b.localizedName));
        filterHeroes();
      } else if (resp) {
        const err = await resp.json().catch(() => ({}));
        showToast(err.message || 'Failed to create hero.', true);
      }
    });
  </script>
</body>
</html>
